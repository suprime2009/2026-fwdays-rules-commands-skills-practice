# Preview Slidev Presentation on Pull Requests
# This workflow builds a preview of the presentation for pull requests

name: Preview PR

on:
  pull_request:
    branches: ["main"]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run validate

      - name: Build presentation
        run: npm run build

      - name: Deploy to Netlify (optional)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: netlify/actions/cli@master
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        with:
          args: deploy --dir=./dist --prod=false
        continue-on-error: true

      - name: Comment PR with preview link
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const previewComment = comments.find(comment =>
              comment.body.includes('Preview deployment')
            );

            const body = `## 👀 Preview deployment

            A preview of the presentation has been deployed and is available at: [Preview Link](${{ secrets.NETLIFY_SITE_URL || 'https://deploy-preview-' + context.issue.number + '--your-netlify-site.netlify.app' }})

            ### 📊 Build Details
            - **Commit:** \`${context.sha.substring(0, 7)}\`
            - **Branch:** \`${context.payload.pull_request.head.ref}\`
            - **Triggered by:** ${context.actor}

            ### ✅ Validation Results
            - Project validation: ✅ Passed
            - Build process: ✅ Successful
            - Static generation: ✅ Completed

            ---
            *This comment was automatically generated by the preview workflow.*`;

            if (previewComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previewComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }