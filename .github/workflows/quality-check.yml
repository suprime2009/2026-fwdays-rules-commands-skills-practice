# Quality Check for Slidev Presentation
# This workflow validates code quality, builds the presentation, and runs tests

name: Quality Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Node.js version
        run: npm run check-node

      - name: Validate dependencies
        run: npm run check-deps

      - name: Lint markdown files
        run: npm run lint

      - name: Run full validation
        run: npm run validate

      - name: Test build process
        run: npm run build

      - name: Check presentation statistics
        run: npm run slide:stats

      - name: Verify generated files
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build directory 'dist' not found"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "❌ Main presentation file 'dist/index.html' not found"
            exit 1
          fi

          echo "✅ Build artifacts verified"
          echo "📊 Build size: $(du -sh dist | cut -f1)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slidev-presentation
          path: dist/
          retention-days: 7